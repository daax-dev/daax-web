name: Publish container images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

# No id-token here, deliberately. Keyless cosign needs `id-token: write`, but
# granted at this level EVERY job could mint the OIDC token and obtain a
# Sigstore certificate for this workflow's identity. Only the `sign` job
# declares it, in its own permissions block. Package write is likewise scoped
# to the jobs that actually push content; all external actions in those jobs
# are pinned by commit SHA.
permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.ref }}
  # A newer main build supersedes an older one before it can move `latest`.
  cancel-in-progress: true

jobs:
  # A valid signature proves which workflow ran, not that the signed commit was
  # reviewed. Refuse feature-branch dispatches and tags pointing outside main;
  # otherwise either can mint a signature matching the consumer policy below.
  validate-ref:
    name: Validate publish source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Require a reviewed main commit
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ] && ! [[ "$REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::release tag is not strict vX.Y.Z: $REF_NAME"
            exit 1
          fi
          if [ "$REF_TYPE" = "tag" ]; then
            package_version="$(node -p "require('./package.json').version")"
            if [ "$REF_NAME" != "v$package_version" ]; then
              echo "::error::release tag $REF_NAME does not match package.json v$package_version"
              exit 1
            fi
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::$GITHUB_REF does not point to a reviewed main commit"
            exit 1
          fi

  # daax-web and daax-terminal are built PER-PLATFORM ON NATIVE RUNNERS, then
  # joined into one manifest list. They used to be `platforms: linux/amd64` with
  # this note:
  #
  #   amd64 only: cloud VMs (Azure x86_64) are amd64, and the arm64 build
  #   compiles node-pty from source under QEMU emulation — minutes -> ~30m+
  #   and fragile.
  #
  # That was true of QEMU and is the right call for QEMU. The cost it describes
  # is emulation, not arm64 — so this builds arm64 on `ubuntu-24.04-arm`, where
  # node-pty compiles natively at amd64 speed. GitHub-hosted arm64 runners are
  # free for public repositories, and this repository is public.
  #
  # The reason to care is fleet parity: chamonix is an arm64 workstation, and an
  # amd64-only image is why it is the one host that cannot pull what the fleet
  # runs. It hand-builds instead, so "the same daax everywhere" was unachievable
  # by construction rather than by neglect.
  #
  # push-by-digest + `imagetools create` is the documented multi-runner pattern:
  # neither build tags anything, the merge job creates the tag pointing at a
  # manifest list. A host then pulls ONE digest and gets its own architecture.
  build:
    name: Build ${{ matrix.image.name }} (${{ matrix.platform.arch }})
    needs: validate-ref
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: daax-web, target: runner }
          - { name: daax-terminal, target: terminal }
        platform:
          - { arch: amd64, id: linux/amd64, runner: ubuntu-latest }
          - { arch: arm64, id: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Full history + tags so `git describe` can name a main-branch build
          # relative to the last release tag (a shallow clone has no tags).
          fetch-depth: 0

      # The build stamp: the three explicit inputs the Dockerfile takes
      # (lib/build/build-env.ts). A tag push IS the version; a branch push is
      # described relative to the last v* tag, or "dev" when none exists —
      # never a bare SHA dressed up as a version (the SHA is stamped on its
      # own). No --dirty in CI: the checkout is by definition clean.
      - name: Build stamp
        id: stamp
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            version="$REF_NAME"
          else
            version="$(git describe --tags --match 'v*' 2>/dev/null || echo dev)"
          fi
          {
            echo "version=$version"
            echo "git_sha=$GITHUB_SHA"
            echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          echo "VERSION=$version GIT_SHA=$GITHUB_SHA"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No QEMU step, deliberately: each runner is already the architecture it
      # builds. Adding it back would silently re-enable emulated builds if a
      # native runner label ever stopped resolving.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # Labels only — this job pushes no tags. The tags are applied by the
      # merge job, to the manifest list. version/created are overridden so the
      # registry labels equal the Dockerfile's OCI labels and the /api/build
      # stamp (metadata-action would otherwise label a main push "main").
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/daax-dev/${{ matrix.image.name }}
          labels: |
            org.opencontainers.image.version=${{ steps.stamp.outputs.version }}
            org.opencontainers.image.created=${{ steps.stamp.outputs.build_time }}

      # sbom + provenance (mode=max) attach BuildKit attestations to the pushed
      # digest as OCI manifests. This pushes only a content-addressed digest,
      # never a release tag; the exact registry object is scanned below before
      # its digest artifact is made available to the merge job.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: ${{ matrix.image.target }}
          platforms: ${{ matrix.platform.id }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          # `push=true` belongs INSIDE outputs here, not as the separate `push:`
          # key — push-by-digest is an output modifier, and the top-level key
          # would push a tag, which is exactly what this job must not do.
          outputs: type=image,name=ghcr.io/daax-dev/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ steps.stamp.outputs.version }}
            GIT_SHA=${{ steps.stamp.outputs.git_sha }}
            BUILD_TIME=${{ steps.stamp.outputs.build_time }}
            BUILD_BRANCH=${{ github.ref_type == 'branch' && github.ref_name || '' }}
          # Cache is scoped per image AND per arch. One shared scope would have
          # the two architectures evicting each other on every run.
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}

      # Scan the exact digest produced above. A separate local build is not a
      # security boundary: mutable package repositories or a cache miss can
      # make a later push differ from what was scanned. No release tag is
      # created until this gate and the signature verification both pass.
      - name: Trivy pushed-digest gate (CRITICAL, fixable)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform.id }}
        with:
          scan-type: image
          image-ref: ghcr.io/daax-dev/${{ matrix.image.name }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          cache-dir: ${{ runner.temp }}/trivy-cache

      # The digest is the FILENAME and the file is empty: the merge job only
      # needs the set of digests, and a content-addressed name cannot collide
      # between the two architectures.
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Named `daax-web` so the sbom job's `needs:` and
  # `needs.daax-web.outputs.image` keep working unchanged. It now resolves to
  # the MANIFEST LIST digest, which is what a host should pin.
  daax-web:
    name: Assemble daax-web candidate
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/daax-dev/daax-web@${{ steps.merge.outputs.digest }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digests-daax-web-*
          merge-multiple: true
          path: /tmp/digests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The temporary candidate tag makes the assembled index addressable for
      # signing. It is not a release tag; public tags are promoted only after
      # every image's cosign verification succeeds.
      - name: Create candidate manifest list
        id: merge
        working-directory: /tmp/digests
        env:
          CANDIDATE: ghcr.io/daax-dev/daax-web:candidate-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # shellcheck disable=SC2046
          # Word splitting produces one source argument per digest file.
          docker buildx imagetools create --tag "$CANDIDATE" \
            $(printf 'ghcr.io/daax-dev/daax-web@sha256:%s ' *)
          digest="$(docker buildx imagetools inspect "$CANDIDATE" --format '{{json .Manifest.Digest}}' | tr -d '\"')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Candidate ghcr.io/daax-dev/daax-web@$digest"
          docker buildx imagetools inspect "ghcr.io/daax-dev/daax-web@$digest"

  daax-terminal:
    name: Assemble daax-terminal candidate
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/daax-dev/daax-terminal@${{ steps.merge.outputs.digest }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digests-daax-terminal-*
          merge-multiple: true
          path: /tmp/digests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create candidate manifest list
        id: merge
        working-directory: /tmp/digests
        env:
          CANDIDATE: ghcr.io/daax-dev/daax-terminal:candidate-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # shellcheck disable=SC2046
          # Word splitting produces one source argument per digest file.
          docker buildx imagetools create --tag "$CANDIDATE" \
            $(printf 'ghcr.io/daax-dev/daax-terminal@sha256:%s ' *)
          digest="$(docker buildx imagetools inspect "$CANDIDATE" --format '{{json .Manifest.Digest}}' | tr -d '\"')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Candidate ghcr.io/daax-dev/daax-terminal@$digest"

  code-server:
    name: Build + scan code-server candidate
    needs: validate-ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/daax-dev/code-server@${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/daax-dev/code-server

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # Push by digest only. Release tags are promoted after both architecture
      # scans and the shared signature/attestation verification succeed.
      - name: Build and push candidate by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: deploy/code-server
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=ghcr.io/daax-dev/code-server,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy code-server amd64 gate (CRITICAL, fixable)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          scan-type: image
          image-ref: ghcr.io/daax-dev/code-server@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          cache-dir: ${{ runner.temp }}/trivy-cache

      - name: Trivy code-server arm64 gate (CRITICAL, fixable)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          scan-type: image
          image-ref: ghcr.io/daax-dev/code-server@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          cache-dir: ${{ runner.temp }}/trivy-cache
          skip-setup-trivy: true

  # Keyless cosign for every candidate digest (daax-web, daax-terminal,
  # code-server): sign the index digest and each platform child, attest a
  # per-platform CycloneDX SBOM to its child digest, then VERIFY all of it
  # against this repo's workflow identity. Public release tags are created by
  # the publish job only after every matrix leg passes, so a signing failure
  # leaves the previous release tags untouched. Signing by digest means the
  # signature follows the bits, not a movable name.
  # Consumers verify the same way (the index for the signature; their own
  # platform's child digest for the SBOM attestation):
  #   cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \
  #     --certificate-identity-regexp '^https://github\.com/daax-dev/daax-web/\.github/workflows/publish-images\.yml@(refs/heads/main|refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$' \
  #     ghcr.io/daax-dev/daax-web@sha256:…
  sign:
    name: Sign + attest (${{ matrix.name }})
    needs: [daax-web, daax-terminal, code-server]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        name: [daax-web, daax-terminal, code-server]
    env:
      COSIGN_YES: "true"
      OIDC_ISSUER: https://token.actions.githubusercontent.com
      # Accept only reviewed main builds and strict release-tag builds.
      IDENTITY_REGEXP: ^https://github\.com/daax-dev/daax-web/\.github/workflows/publish-images\.yml@(refs/heads/main|refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pinned by commit SHA (release v4.1.2), not a floating tag: the tool that
      # produces the signature must itself be an exact, reviewable artifact.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      # Matrix can't reference `needs`, so map name → digest-pinned ref here.
      - name: Resolve image ref
        id: img
        env:
          WEB: ${{ needs.daax-web.outputs.image }}
          TERMINAL: ${{ needs.daax-terminal.outputs.image }}
          CODE_SERVER: ${{ needs.code-server.outputs.image }}
        run: |
          case "${{ matrix.name }}" in
            daax-web) ref="$WEB" ;;
            daax-terminal) ref="$TERMINAL" ;;
            code-server) ref="$CODE_SERVER" ;;
          esac
          case "$ref" in
            *@sha256:*) ;;
            *) echo "::error::not a digest ref: $ref"; exit 1 ;;
          esac
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "signing $ref"

      # The candidate ref is a multi-platform INDEX. A signature on the index
      # covers the whole thing, but an SBOM is per platform: syft on the index
      # would silently describe only the runner's own arch (amd64), and an
      # arm64 consumer would then "verify" an inventory of x86 packages. So the
      # index is signed, and EACH platform child digest is signed and gets its
      # own CycloneDX attestation. Attestation manifests (platform unknown/
      # unknown, from BuildKit's provenance/sbom) are not platforms and are
      # skipped.
      - name: Resolve platform child digests
        id: platforms
        env:
          REF: ${{ steps.img.outputs.ref }}
        run: |
          docker buildx imagetools inspect "$REF" --raw > index.json
          jq -r '.manifests[]
                 | select(.platform != null and .platform.os != "unknown")
                 | "\(.platform.os)/\(.platform.architecture) \(.digest)"' index.json > platforms.txt
          [ -s platforms.txt ] || { echo "::error::no platform manifests in $REF"; exit 1; }
          echo "platforms:"; cat platforms.txt

      - name: Sign index and platform children (keyless)
        env:
          REF: ${{ steps.img.outputs.ref }}
        run: |
          repo="${REF%@*}"
          cosign sign --yes "$REF"
          while read -r platform digest; do
            cosign sign --yes "${repo}@${digest}"
            echo "signed ${platform} ${digest}"
          done < platforms.txt

      # CycloneDX SBOM of exactly each platform child digest, attested in-toto
      # style to THAT digest so the SBOM is bound to the image it describes.
      # The same placeholder-vs-real floor as lib/sbom-guard.ts applies: an
      # empty SBOM is not attested — and a missing one fails the job.
      - name: Attest a per-platform SBOM (CycloneDX, keyless)
        env:
          REF: ${{ steps.img.outputs.ref }}
        run: |
          repo="${REF%@*}"
          while read -r platform digest; do
            out="sbom-$(echo "$platform" | tr '/' '-').cdx.json"
            syft --platform "$platform" "registry:${repo}@${digest}" -o cyclonedx-json > "$out"
            # shellcheck disable=SC2016
            # JavaScript template literals must remain literal to this shell.
            node -e '
              const [f, platform] = process.argv.slice(1);
              const o = JSON.parse(require("fs").readFileSync(f, "utf8"));
              if (o.bomFormat !== "CycloneDX" || !Array.isArray(o.components) || o.components.length === 0) {
                console.error(`SBOM for ${platform} is not a real CycloneDX document — refusing to attest`); process.exit(1);
              }
              console.log(`SBOM ${platform} OK: ${o.components.length} components`);
            ' "$out" "$platform"
            cosign attest --yes --type cyclonedx --predicate "$out" "${repo}@${digest}"
            echo "attested ${platform} ${digest}"
          done < platforms.txt

      # The gate: verify what was just produced, as a consumer would — the
      # index signature, and each child's signature + SBOM attestation. Any
      # failure fails the job (set -e is the default for `run`).
      - name: Verify signatures and attestations
        env:
          REF: ${{ steps.img.outputs.ref }}
        run: |
          repo="${REF%@*}"
          cosign verify \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            --certificate-identity-regexp "$IDENTITY_REGEXP" \
            "$REF" > /dev/null
          echo "verified index signature $REF"
          while read -r platform digest; do
            cosign verify \
              --certificate-oidc-issuer "$OIDC_ISSUER" \
              --certificate-identity-regexp "$IDENTITY_REGEXP" \
              "${repo}@${digest}" > /dev/null
            cosign verify-attestation --type cyclonedx \
              --certificate-oidc-issuer "$OIDC_ISSUER" \
              --certificate-identity-regexp "$IDENTITY_REGEXP" \
              "${repo}@${digest}" > /dev/null
            echo "verified ${platform} signature + cyclonedx attestation ${digest}"
          done < platforms.txt

  # Promotion is the release boundary. Candidate content is already in GHCR so
  # it can be scanned and signed by digest, but no public tag moves until every
  # image has passed both its vulnerability gate and cosign verification.
  publish:
    name: Publish verified ${{ matrix.name }}
    needs: [daax-web, daax-terminal, code-server, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: [daax-web, daax-terminal, code-server]
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract release tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/daax-dev/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # A tag run stamps different metadata from the preceding main run
            # at the same commit. Publish sha-* only for branch runs so those
            # two valid builds cannot race to assign one tag to different bits.
            type=sha,format=short,enable=${{ github.ref_type == 'branch' }}

      - name: Resolve verified image ref
        id: img
        env:
          WEB: ${{ needs.daax-web.outputs.image }}
          TERMINAL: ${{ needs.daax-terminal.outputs.image }}
          CODE_SERVER: ${{ needs.code-server.outputs.image }}
        run: |
          case "${{ matrix.name }}" in
            daax-web) ref="$WEB" ;;
            daax-terminal) ref="$TERMINAL" ;;
            code-server) ref="$CODE_SERVER" ;;
          esac
          case "$ref" in
            *@sha256:*) ;;
            *) echo "::error::not a digest ref: $ref"; exit 1 ;;
          esac
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Promote verified digest to release tags
        env:
          REF: ${{ steps.img.outputs.ref }}
        run: |
          # shellcheck disable=SC2046
          # metadata-action emits controlled registry refs; word splitting
          # produces one `-t <tag>` pair for imagetools.
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "$REF"
          first_tag="$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          promoted="$(docker buildx imagetools inspect "$first_tag" --format '{{json .Manifest.Digest}}' | tr -d '\"')"
          [ "${REF##*@}" = "$promoted" ] || {
            echo "::error::promoted digest $promoted does not match $REF"
            exit 1
          }
          echo "Published verified $REF as $DOCKER_METADATA_OUTPUT_TAGS"

  # F2 (#97): generate a real SBOM (CycloneDX + SPDX) for each published image,
  # keyed by the pushed digest, and upload as workflow artifacts (4 total:
  # {daax-web, code-server} × {cyclonedx-json, spdx-json}). A placeholder-vs-real
  # guard rejects an empty/undersized SBOM so a fake-present SBOM is never shipped.
  # Runtime catalog builds populate built_images.sbom_json separately (the DB is
  # not reachable from CI); these artifacts feed the F8 build-provenance page (#99).
  sbom:
    name: SBOM (${{ matrix.name }}, ${{ matrix.format }})
    needs: [publish, daax-web, code-server]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: daax-web, format: cyclonedx-json }
          - { name: daax-web, format: spdx-json }
          - { name: code-server, format: cyclonedx-json }
          - { name: code-server, format: spdx-json }
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Resolve the digest-pinned image ref explicitly (matrix can't reference
      # `needs`; avoids the &&/|| truthiness edge case).
      - name: Resolve image ref
        id: img
        run: |
          if [ "${{ matrix.name }}" = "daax-web" ]; then
            echo "ref=${{ needs.daax-web.outputs.image }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ needs.code-server.outputs.image }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate SBOM with syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.img.outputs.ref }}
          format: ${{ matrix.format }}
          output-file: sbom-${{ matrix.name }}-${{ matrix.format }}.json
          upload-artifact: false

      # Placeholder-vs-real guard, mirroring lib/sbom-guard.ts (size floor +
      # format marker + non-empty inventory). A placeholder is REPORTED as a
      # warning and simply not uploaded (real=false) — it does NOT fail the
      # publish, so a temporarily-unavailable SBOM never blocks shipping images.
      - name: Guard placeholder-vs-real
        id: guard
        run: |
          file="sbom-${{ matrix.name }}-${{ matrix.format }}.json"
          # shellcheck disable=SC2016
          # JavaScript template literals must remain literal to this shell.
          node -e '
            const fs = require("fs");
            const f = process.argv[1];
            let real = true, reason = "";
            try {
              const raw = fs.readFileSync(f, "utf8");
              const bytes = Buffer.byteLength(raw, "utf8");
              if (bytes < 512) { real = false; reason = `undersized (${bytes}B)`; }
              else {
                const o = JSON.parse(raw);
                const cdx = o.bomFormat === "CycloneDX" && Array.isArray(o.components) && o.components.length > 0;
                const spdx = typeof o.spdxVersion === "string" && Array.isArray(o.packages) && o.packages.length > 0;
                if (!cdx && !spdx) { real = false; reason = "no format marker / components"; }
              }
            } catch { real = false; reason = "unparseable"; }
            if (!real) console.log(`::warning::SBOM ${f} unavailable (${reason}) — not uploading`);
            else console.log(`SBOM ${f} OK`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `real=${real}\n`);
          ' "$file"

      - name: Upload SBOM artifact
        if: steps.guard.outputs.real == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sbom-${{ matrix.name }}-${{ matrix.format }}
          path: sbom-${{ matrix.name }}-${{ matrix.format }}.json
          if-no-files-found: error
